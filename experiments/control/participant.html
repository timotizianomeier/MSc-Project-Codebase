<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Study session</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      /* Page-local layout only; all look-and-feel comes from the app's style.css. */
      .participant {
        max-width: 34rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .participant__hint {
        opacity: 0.75;
        line-height: 1.5;
        margin: 0;
      }
      .participant__send {
        align-self: stretch;
        padding: 0.75rem 1.5rem;
        font-size: 1.1rem;
      }
      .participant__status {
        min-height: 1.5rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="participant">
      <h1>Study session</h1>
      <p class="participant__hint">Press start when you are ready to begin.</p>
      <button type="button" id="session-start" class="participant__send">Start session</button>
      <p class="participant__status" id="session-status" role="status"></p>
    </main>
    <script type="module">
      import { describeError, rpcCall } from "/static/js/api.js";

      const startButton = document.getElementById("session-start");
      const sessionStatus = document.getElementById("session-status");

      // The control script always gates, so the button shows by default; a reload
      // mid-session or post-session just reports the state instead.
      async function initSessionGate() {
        try {
          const s = await rpcCall("session.status");
          if (s.started && s.active) {
            startButton.hidden = true;
            sessionStatus.textContent = "Session running.";
          } else if (s.started && !s.active) {
            startButton.hidden = true;
            sessionStatus.textContent = "Session complete — thank you!";
          }
        } catch (error) {
          sessionStatus.textContent = `Could not reach the study system. (${describeError(error)})`;
        }
      }

      startButton.addEventListener("click", async () => {
        startButton.disabled = true; // UX only; the server is idempotent regardless
        sessionStatus.textContent = "Starting…";
        try {
          await rpcCall("session.start");
          startButton.hidden = true;
          sessionStatus.textContent = "Session running — you can start working now.";
        } catch (error) {
          startButton.disabled = false;
          sessionStatus.textContent = `Could not start, please try again. (${describeError(error)})`;
        }
      });

      initSessionGate();
    </script>
  </body>
</html>
