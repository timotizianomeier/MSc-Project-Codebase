<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Reachy · Task context</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      /* Page-local layout only; all look-and-feel comes from style.css. */
      .participant {
        max-width: 34rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .participant__brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .participant__brand img {
        width: 2.2rem;
        height: 2.2rem;
      }
      .participant__hint {
        opacity: 0.75;
        line-height: 1.5;
        margin: 0;
      }
      .participant__input {
        min-height: 7rem;
        resize: vertical;
      }
      .participant__input::placeholder {
        font-style: italic;
      }
      /* style.css lays the chat form out as a row; stack it so the button sits below. */
      .participant .talk__chat {
        flex-direction: column;
        align-items: stretch;
      }
      .participant__send {
        align-self: stretch;
        padding: 0.75rem 1.5rem;
        font-size: 1.1rem;
      }
      .participant__status {
        min-height: 1.5rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="participant">
      <div class="participant__brand">
        <img src="/static/avatars/default.svg" alt="" draggable="false" />
        <strong>"Reachy" study companion</strong>
      </div>
      <h1>Share your task with Reachy</h1>
      <p class="participant__hint">
        You can simply paste the task itself (e.g., exercise, problem sheet, reading etc.) or describe it in your own words.
        Reachy will keep it in mind. You can send updates any time.
      </p>
      <button type="button" id="session-start" class="participant__send" hidden>Start session</button>
      <p class="participant__status" id="session-status" role="status"></p>
      <form id="context-form" class="talk__chat">
        <textarea
          id="context-input"
          class="talk__chat-input participant__input"
          placeholder="e.g. I'm working on the following coding exercise: Given an integer array nums and an integer k, return the k most frequent elements within the array."
          autocomplete="off"
        ></textarea>
        <button type="submit" id="context-send" class="participant__send">Send to Reachy</button>
      </form>
      <p class="participant__status" id="context-status" role="status"></p>
    </main>
    <script type="module">
      import { sendChat, describeError, rpcCall } from "/static/js/api.js";

      const form = document.getElementById("context-form");
      const input = document.getElementById("context-input");
      const send = document.getElementById("context-send");
      const status = document.getElementById("context-status");
      const startButton = document.getElementById("session-start");
      const sessionStatus = document.getElementById("session-status");
      let pending = false;

      // Session-gate states: gate off -> form usable immediately (dev runs);
      // gate on -> Start button first, form only once the session is running.
      function setFormEnabled(enabled) {
        input.disabled = !enabled;
        send.disabled = !enabled;
      }

      async function initSessionGate() {
        try {
          const s = await rpcCall("session.status");
          if (!s.gate_enabled) return; // stock behavior, no button
          if (s.started && s.active) {
            sessionStatus.textContent = "Session running.";
          } else if (s.started && !s.active) {
            setFormEnabled(false);
            sessionStatus.textContent = "Session complete — thank you!";
          } else {
            setFormEnabled(false);
            startButton.hidden = false;
            sessionStatus.textContent = "Press start when you are ready to begin.";
          }
        } catch (error) {
          sessionStatus.textContent = `Could not reach Reachy. (${describeError(error)})`;
        }
      }

      startButton.addEventListener("click", async () => {
        startButton.disabled = true; // UX only; the server is idempotent regardless
        sessionStatus.textContent = "Starting…";
        try {
          await rpcCall("session.start");
          startButton.hidden = true;
          setFormEnabled(true);
          sessionStatus.textContent = "Session running — Reachy will greet you in a moment.";
        } catch (error) {
          startButton.disabled = false;
          sessionStatus.textContent = `Could not start, please try again. (${describeError(error)})`;
        }
      });

      initSessionGate();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (pending) return;
        const text = input.value.trim();
        if (!text) return;
        pending = true;
        send.disabled = true;
        status.textContent = "Sending…";
        try {
          await sendChat(text);
          input.value = "";
          status.textContent = "✓ Reachy has received your context.";
        } catch (error) {
          status.textContent = `Could not send, please try again. (${describeError(error)})`;
        } finally {
          pending = false;
          send.disabled = false;
        }
      });
    </script>
  </body>
</html>
