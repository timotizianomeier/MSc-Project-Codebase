<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Reachy · Task context</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      /* Page-local layout only; all look-and-feel comes from style.css. */
      .participant {
        max-width: 34rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .participant__brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .participant__brand img {
        width: 2.2rem;
        height: 2.2rem;
      }
      .participant__hint {
        opacity: 0.75;
        line-height: 1.5;
        margin: 0;
      }
      .participant__input {
        min-height: 7rem;
        resize: vertical;
      }
      .participant__input::placeholder {
        font-style: italic;
      }
      /* style.css lays the chat form out as a row; stack it so the button sits below. */
      .participant .talk__chat {
        flex-direction: column;
        align-items: stretch;
      }
      .participant__send {
        align-self: stretch;
        padding: 0.75rem 1.5rem;
        font-size: 1.1rem;
      }
      .participant__status {
        min-height: 1.5rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="participant">
      <div class="participant__brand">
        <img src="/static/avatars/default.svg" alt="" draggable="false" />
        <strong>Reachy</strong>
      </div>
      <h1>Share your task with Reachy</h1>
      <p class="participant__hint">
        Give Reachy more context about what you are working on.<br />
        Simply copy + paste the exercise, reading, or problem set.<br />
        Reachy will keep it in mind. You can send updates any time.
      </p>
      <form id="context-form" class="talk__chat">
        <textarea
          id="context-input"
          class="talk__chat-input participant__input"
          placeholder="e.g. I'm working on the following coding exercise: Given an integer array nums and an integer k, return the k most frequent elements within the array."
          autocomplete="off"
        ></textarea>
        <button type="submit" id="context-send" class="participant__send">Send to Reachy</button>
      </form>
      <p class="participant__status" id="context-status" role="status"></p>
    </main>
    <script type="module">
      import { sendChat, describeError } from "/static/js/api.js";

      const form = document.getElementById("context-form");
      const input = document.getElementById("context-input");
      const send = document.getElementById("context-send");
      const status = document.getElementById("context-status");
      let pending = false;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (pending) return;
        const text = input.value.trim();
        if (!text) return;
        pending = true;
        send.disabled = true;
        status.textContent = "Sending…";
        try {
          await sendChat(text);
          input.value = "";
          status.textContent = "✓ Reachy has received your context.";
        } catch (error) {
          status.textContent = `Could not send, please try again. (${describeError(error)})`;
        } finally {
          pending = false;
          send.disabled = false;
        }
      });
    </script>
  </body>
</html>
